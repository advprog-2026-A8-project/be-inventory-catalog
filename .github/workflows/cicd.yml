name: CI/CD Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the Git repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java toolchain
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Add gradlew permission
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew clean test jacocoTestReport

      - name: SonarCloud Scan (Push)
        if: github.event_name == 'push'
        run: ./gradlew sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan (PR)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew sonar \
            -Dsonar.pullrequest.key="$SONAR_PR_KEY" \
            -Dsonar.pullrequest.branch="$SONAR_PR_BRANCH" \
            -Dsonar.pullrequest.base="$SONAR_PR_BASE" \
            -Dsonar.pullrequest.provider=GitHub \
            -Dsonar.pullrequest.github.repository="$SONAR_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_BASE: ${{ github.base_ref }}
          SONAR_REPOSITORY: ${{ github.repository }}

  build-and-push:
    name: Build and Push Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java toolchain
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Add gradlew permission
        run: chmod +x gradlew

      - name: Build application jar
        run: ./gradlew clean bootJar

      - name: Set image variables
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_REPO: ${{ secrets.DOCKER_HUB_REPO_NAME }}
        run: |
          echo "IMAGE_NAME=$DOCKER_HUB_USER/$DOCKER_HUB_REPO" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ee4ca427a2f43b6a16632044ca514c076267da23 # v6.19.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy-main:
    name: Deploy Main
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          REMOTE_DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          REMOTE_DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          REMOTE_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          REMOTE_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REMOTE_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REMOTE_DOCKER_HUB_REPO_NAME: ${{ secrets.DOCKER_HUB_REPO_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          envs: REMOTE_DOCKER_HUB_USERNAME,REMOTE_DOCKER_HUB_ACCESS_TOKEN,REMOTE_POSTGRES_USER,REMOTE_POSTGRES_PASSWORD,REMOTE_JWT_SECRET,REMOTE_DOCKER_HUB_REPO_NAME
          script: |
            set -euo pipefail

            IMAGE_NAME="${REMOTE_DOCKER_HUB_USERNAME}/${REMOTE_DOCKER_HUB_REPO_NAME}"
            IMAGE_TAG="latest"
            APP_CONTAINER_NAME="be_inventory_catalog_prod"
            APP_PORT="4000"
            DB_CONTAINER_NAME="postgres_inventory_catalog_prod"
            DB_NAME="inventorydb"
            DB_PORT="4001"
            DB_VOLUME="postgres_inventory_catalog_prod_data"

            docker network create app_network || true

            echo "$REMOTE_DOCKER_HUB_ACCESS_TOKEN" | docker login -u "$REMOTE_DOCKER_HUB_USERNAME" --password-stdin
            docker pull "$IMAGE_NAME:$IMAGE_TAG"

            if [ "$(docker ps -aq -f name=^${DB_CONTAINER_NAME}$)" ]; then
              if [ ! "$(docker ps -q -f name=^${DB_CONTAINER_NAME}$)" ]; then
                docker start "$DB_CONTAINER_NAME"
              fi
            else
              docker run -d \
                --name="$DB_CONTAINER_NAME" \
                --network=app_network \
                -p "$DB_PORT:5432" \
                -v "$DB_VOLUME:/var/lib/postgresql/data" \
                -e POSTGRES_DB="$DB_NAME" \
                -e POSTGRES_USER="$REMOTE_POSTGRES_USER" \
                -e POSTGRES_PASSWORD="$REMOTE_POSTGRES_PASSWORD" \
                --restart always \
                postgres:15-alpine
            fi

            for i in $(seq 1 30); do
              if docker exec "$DB_CONTAINER_NAME" pg_isready -U "$REMOTE_POSTGRES_USER" -d "$DB_NAME"; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Database failed to become ready."
                docker logs "$DB_CONTAINER_NAME" || true
                exit 1
              fi
              echo "Waiting for database readiness ($i/30)..."
              sleep 2
            done

            docker stop "$APP_CONTAINER_NAME" || true
            docker rm "$APP_CONTAINER_NAME" || true

            docker run -d \
              --name="$APP_CONTAINER_NAME" \
              --network=app_network \
              -p "$APP_PORT:4002" \
              -e SERVER_PORT=4002 \
              -e POSTGRES_HOST="$DB_CONTAINER_NAME" \
              -e POSTGRES_PORT=5432 \
              -e POSTGRES_DB="$DB_NAME" \
              -e POSTGRES_USER="$REMOTE_POSTGRES_USER" \
              -e POSTGRES_PASSWORD="$REMOTE_POSTGRES_PASSWORD" \
              -e JWT_SECRET="$REMOTE_JWT_SECRET" \
              --restart always \
              "$IMAGE_NAME:$IMAGE_TAG"

            docker ps
