services:
  inventory-postgres:
    image: postgres:15-alpine
    container_name: inventory-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventorydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "4003:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inventorydb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app-dev
    depends_on:
      inventory-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 4002
      POSTGRES_HOST: inventory-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-inventorydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4002:4002"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: inventory-prometheus-dev
    profiles: ["observability"]
    depends_on:
      - inventory-app
    volumes:
      - ./docs/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: inventory-grafana-dev
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docs/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/inventory-catalog.json:ro
    ports:
      - "3000:3000"

volumes:
  inventory_pgdata:
  grafana_data:
